name: Docs

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/docs/**'
      - 'packages/react/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; newer runs cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The docs import the published dist (not src), proving SSR-safety against
      # the real package. Build the library first.
      - name: Build library
        run: pnpm --filter @orionshub/lucent build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Build docs
        run: pnpm --filter @lucent/docs docs:build
        env:
          # GitHub Pages serves the project site under /<repo>/.
          DOCS_BASE: /lucent/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
